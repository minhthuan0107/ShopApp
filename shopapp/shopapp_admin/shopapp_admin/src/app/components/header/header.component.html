<!-- admin-header.component.html -->
<nav class="admin-navbar d-flex align-items-center justify-content-between shadow">
  <div class="admin-navbar__left d-flex align-items-center">
    <button class="toggle-btn" (click)="onToggleSidebar()">
      <i class="fas fa-bars"></i>
    </button>
    <span class="admin-navbar__title">ThuanLe Shop</span>
  </div>

  <div class="admin-navbar__right d-flex align-items-center">
    <!-- Thông báo -->
    <div class="nav-item position-relative">
              <a class="nav-link position-relative" title="Thông báo">
                <div class="notification-wrapper">
                  <i class="fas fa-bell bell-icon" (click)="toggleNotificationDropdown()"></i>
                  <span class="notification-badge" *ngIf="getUnreadCount() > 0">
                    {{ getUnreadCount() }}
                  </span>
                  <div class="notification-panel" *ngIf="isNotificationDropdownOpen">
                    <div class="notification-header">
                      Thông báo
                      <div class="notification-tabs">
                        <span class="tab" [ngClass]="{ 'active': selectedTab === 'all' }"
                          (click)="onTabClick('all')">Tất cả</span>
                        <span class="tab" [ngClass]="{ 'active': selectedTab === 'unread' }"
                          (click)="onTabClick('unread')">Chưa đọc</span>
                      </div>
                    </div>

                    <div class="notification-list">
                      <ng-container *ngIf="getCurrentNotifications().length > 0; else noNotifications">
                        <div class="notification-item" *ngFor="let notify of getCurrentNotificationsLimited()"
                          (click)="markAsRead(notify)"
                          [ngClass]="{ 'unread': !notify.is_read, 'read': notify.is_read }">
                          <div class="content">
                            <div class="text">
                              🔔 {{ notify.content }}
                              <div class="time">{{ notify.create_at | amTimeAgo }}</div>
                            </div>
                            <div class="menu-toggle" (click)="toggleMenu(notify, $event)">⋯</div>
                            <div class="notification-menu" *ngIf="notify.showMenu">
                              <button class="menu-item" (click)="deleteNotification(notify)">
                                <i class="fas fa-times-circle"></i> Xóa thông báo này</button>
                            </div>
                          </div>
                        </div>

                        <div *ngIf="!showAllNotifications && getCurrentNotifications().length > visibleLimit"
                          class="see-more" (click)="showAllNotifications = true; $event.stopPropagation()">
                          <span>Xem thêm thông báo trước đó</span>
                        </div>
                      </ng-container>
                      <ng-template #noNotifications>
                        <div class="no-notifications">Không có thông báo nào.</div>
                      </ng-template>
                    </div>
                  </div>
                </div>
              </a>
            </div>
    <!-- Email -->
    <a class="btn btn-icon ml-2" href="https://mail.google.com/" target="_blank">
      <i class="fas fa-envelope my-envelope"></i>
    </a>

    <!-- Tài khoản -->
    <div class="dropdown user-menu ml-3">
      <button class="btn btn-user d-flex align-items-center" data-bs-toggle="dropdown">
        <span class="fw-semibold">{{ (user$ | async)?.full_name }}</span>
        <i class="fas fa-bars ms-2 small text-white"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li>
          <a class="dropdown-item d-flex align-items-center" href="#">
            <i class="fas fa-user-circle me-2 text-primary"></i> Thông tin cá nhân
          </a>
        </li>
        <li>
          <a class="dropdown-item d-flex align-items-center" href="#">
            <i class="fas fa-cog me-2 text-warning"></i> Cài đặt
          </a>
        </li>
        <li>
          <hr class="dropdown-divider">
        </li>
        <li>
          <a class="dropdown-item d-flex align-items-center text-danger logout-link" (click)="logout()">
            <i class="fas fa-sign-out-alt me-2"></i> Đăng xuất
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
